# Alembic configuration for MANABI.
# The database URL is injected programmatically (app.migrations / env.py) from
# get_settings().DATABASE_URL so both the CLI (`python -m alembic upgrade head`,
# run from backend/) and the app startup path use the same source of truth.

[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden at runtime from DATABASE_URL; kept here only as a fallback marker.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
