key: sih
name: Smart India Hackathon
base_url: https://sih.gov.in
compliance:
  verdict: allowed
  checked_on: 2026-11-03
  record: docs/sources/sih.md
  contact: from env CRAWLER_CONTACT
politeness:
  min_delay_seconds: 3
  max_pages_per_run: 200
  max_concurrency: 1
  max_bytes: 5000000
parse:
  source_id_regex: 'SIH\d{4,5}'
  edition_from: url_or_title
display_policy: summary_only
publish:
  auto_publish: true
  min_confidence: 0.75
discovery:
  method: file_table
  urls:
    - https://sih.gov.in/letters/SIH_PS_2024.xlsx
  parser: sih_xlsx
  year: 2024
