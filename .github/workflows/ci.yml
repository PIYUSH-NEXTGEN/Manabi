name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade "pip==26.3"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Alembic migration smoke check (SQLite)
        run: python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:////tmp/ci-smoke.db"
      - name: Backend tests (mock LLM, in-memory SQLite)
        run: python -m pytest -q
        working-directory: backend
        env:
          LLM_PROVIDER: mock

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: manabi
          POSTGRES_PASSWORD: manabi-ci-only
          POSTGRES_DB: manabi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manabi -d manabi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade "pip==26.3"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Alembic upgrade on Postgres
        run: |
          python -m alembic upgrade head
          python -m alembic current | tee /tmp/current
          grep -q "(head)" /tmp/current
        working-directory: backend
        env:
          DATABASE_URL: postgresql://manabi:manabi-ci-only@localhost:5432/manabi_ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Typecheck + production build
        run: npm run build
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E smoke test
        run: npm run e2e
        working-directory: frontend
