name: Keep production awake

# Two free-tier behaviours would otherwise take the deployed site down on their
# own: Render sleeps a web service after ~15 minutes without traffic, and a
# Supabase free project pauses after about a week with no database activity.
# Hitting readiness runs a query, which counts as activity for both, so one
# daily ping keeps the database from pausing (Render still sleeps between
# pings; the first visitor pays the cold start).
on:
  schedule:
    # 06:17 UTC daily. Off the hour to avoid the busiest scheduler window.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the API and touch the database
        run: |
          set -euo pipefail
          url="https://manabi-bsh.pages.dev/api/health/ready"
          for attempt in 1 2 3; do
            code=$(curl -sS -m 120 -o body.json -w '%{http_code}' "$url" || true)
            echo "attempt ${attempt}: HTTP ${code} $(cat body.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "readiness stayed unhealthy; check Render and the database" >&2
          exit 1
