name: Keep production awake

# Backstop for the daily Supabase keepalive. The Cloudflare Worker in
# keepalive-worker/ pings liveness every 10 minutes so Render does not spin
# down, and readiness once a day. This workflow keeps a second daily readiness
# ping in case the Worker or its credentials break, so a free Supabase project
# still sees database activity and does not pause.
on:
  schedule:
    # 06:17 UTC daily. Off the hour to avoid the busiest scheduler window.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the API and touch the database
        run: |
          set -euo pipefail
          url="https://manabi-bsh.pages.dev/api/health/ready"
          for attempt in 1 2 3; do
            code=$(curl -sS -m 120 -o body.json -w '%{http_code}' "$url" || true)
            echo "attempt ${attempt}: HTTP ${code} $(cat body.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "readiness stayed unhealthy; check Render and the database" >&2
          exit 1
